name: Test Suite

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC nightly

  workflow_dispatch:


env:
  POETRY_VERSION: "1.8.3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} - [redis ${{ matrix.redis-version }}]${{ matrix.deps == 'latest' && ' - [latest deps]' || '' }}
    runs-on: ubuntu-latest
    # Temporary: the latest-deps job fails on redis-py 8 (default pool of 100
    # connections exhausted by test_large_batches_async; RESP3 default breaks
    # the protocol-version tests in test_issue_124). Remove once those are fixed
    # so a breaking dependency release fails the run again.
    continue-on-error: ${{ matrix.deps == 'latest' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', 3.11, 3.12, 3.13 ]
        # 'latest' is the final Redis Stack line (7.4.x), for users not yet on
        # Redis 8; '8.0.2' is the oldest Redis 8 release and '8' the newest.
        redis-version: [ 'latest', '8.0.2', '8' ]
        deps: [ 'locked' ]
        include:
          # One extra job on the newest runtime dependencies pyproject.toml
          # allows, i.e. what a fresh install of this package resolves to.
          - python-version: 3.13
            redis-version: '8.0.2'
            deps: 'latest'

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          pip wheel --no-cache-dir --use-pep517 ml-dtypes
          poetry install --all-extras

      - name: Resolve runtime dependencies to the latest allowed releases
        if: matrix.deps == 'latest'
        run: |
          poetry update --lock redisvl redis langgraph-checkpoint
          poetry install --all-extras
          poetry run python -c "import importlib.metadata as m; print({p: m.version(p) for p in ('redisvl', 'redis', 'langgraph-checkpoint')})"

      - name: Set Redis image name
        run: |
          if [[ "${{ matrix.redis-version }}" == 8* ]]; then
            echo "REDIS_IMAGE=redis:${{ matrix.redis-version }}" >> $GITHUB_ENV
          else
            echo "REDIS_IMAGE=redis/redis-stack-server:${{ matrix.redis-version }}" >> $GITHUB_ENV
          fi

      - name: Run API tests
        if: matrix.redis-version == 'latest'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          make test-all

      - name: Run tests
        if: matrix.redis-version != 'latest'
        run: |
          make test
