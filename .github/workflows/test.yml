name: Test Suite

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC nightly

  workflow_dispatch:


env:
  POETRY_VERSION: "1.8.3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} - [redis ${{ matrix.redis-version }}]${{ matrix.deps == 'latest' && ' - [latest deps]' || '' }}
    runs-on: ubuntu-latest
    # Upstream dependency changes are advisory on PRs; nightly runs still fail.
    continue-on-error: ${{ matrix.deps == 'latest' && github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', 3.11, 3.12, 3.13 ]
        # '8.2' is the oldest Redis 8 we test and '8' the newest.
        redis-version: [ '8.2', '8' ]
        deps: [ 'locked' ]
        include:
          # One extra job on the newest redisvl, redis and langgraph-checkpoint
          # that pyproject.toml allows; every other package stays locked.
          # Match the locked Python 3.13 / Redis 8 job to isolate dependency
          # changes while testing against the newest Redis 8.
          - python-version: 3.13
            redis-version: '8'
            deps: 'latest'

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          pip wheel --no-cache-dir --use-pep517 ml-dtypes
          poetry install --all-extras

      - name: Resolve runtime dependencies to the latest allowed releases
        if: matrix.deps == 'latest'
        run: |
          poetry update --lock redisvl redis langgraph-checkpoint
          poetry install --all-extras
          poetry run python -c "import importlib.metadata as m; print({p: m.version(p) for p in ('redisvl', 'redis', 'langgraph-checkpoint')})"

      - name: Set Redis image name
        run: |
          echo "REDIS_IMAGE=redis:${{ matrix.redis-version }}" >> $GITHUB_ENV

      # API-key tests run once per Python version, on the locked newest Redis 8.
      - name: Run API tests
        if: matrix.redis-version == '8' && matrix.deps == 'locked'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          make test-all

      - name: Run tests
        if: matrix.redis-version != '8' || matrix.deps != 'locked'
        run: |
          make test
